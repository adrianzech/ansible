---
name: Ansible quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and lint tooling
        run: python -m pip install ansible ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Check playbook syntax
        run: ansible-playbook -i inventory.yml playbooks/homelab.yml --syntax-check

      - name: Lint playbooks
        run: ansible-lint
