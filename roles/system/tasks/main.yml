---
- name: Install time synchronisation service
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present

- name: Set the server timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Ensure time synchronisation is enabled
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true

- name: Suppress the Debian login banner for the management user
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[user][4] }}/.hush_login"
    state: touch
    owner: "{{ user }}"
    group: "{{ ansible_facts.getent_passwd[user][2] }}"
    mode: "0644"
