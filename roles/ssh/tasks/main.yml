---
- name: Set authorized keys
  ansible.posix.authorized_key:
    user: "{{ user }}"
    state: present
    key: "{{ lookup('ansible.builtin.file', item) }}"
  loop:
    - adrianzech.pub

- name: Ensure the SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SSH hardening drop-in
  ansible.builtin.template:
    src: 99-homelab.conf.j2
    dest: /etc/ssh/sshd_config.d/99-homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Validate and reload sshd

- name: Apply validated SSH configuration immediately
  ansible.builtin.meta: flush_handlers
